<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>HUSF · Painel de Governança</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Archivo:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
// Diagnóstico. Uma página de conselho que falha em branco é indiagnosticável:
// qualquer falha de carregamento precisa virar texto legível, não tela vazia.
window.__dg = { erros: [] };
window.addEventListener('error', function (ev) {
  var alvo = ev.target && ev.target.src;
  window.__dg.erros.push(alvo ? ('não carregou: ' + alvo) : (ev.message || 'erro de script'));
}, true);
window.__dgFalhou = function (titulo, detalhe, extra) {
  var r = document.getElementById('root');
  if (!r) return;
  r.innerHTML = '<main style="padding:60px 44px"><h1>' + titulo + '</h1>' +
    '<p class="lede">' + detalhe + '</p>' +
    (extra ? '<p class="lede" style="color:#7A7F86;font-family:\'Roboto Mono\',monospace;font-size:12px">'
             + extra + '</p>' : '') + '</main>';
};
</script>
<!-- Ordem obrigatória. O UMD do Recharts resolve como Recharts = fn(window.React,
     window.PropTypes): sem prop-types carregado antes, ele não se registra.
     O arquivo é umd/Recharts.js — não existe Recharts.min.js publicado.
     A versão 2.1.9 não declara suporte a React 18; a 2.15.4 declara. -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
<script src="https://unpkg.com/recharts@2.15.4/umd/Recharts.js"></script>
<style>
:root{
  --paper:#E9E7E1; --panel:#F8F7F4; --panel2:#F1EFEA; --track:#DFDCD4;
  --rule:#D6D3CB; --rule2:#C3BFB5; --grid:#E0DDD5;
  --ink:#1B1F24; --ink2:#4A4E52; --ink3:#7A7F86;
  --azul:#14395F; --azul2:#5A7590; --azul3:#93A8B8; --vermelho:#9E2A2B;
  --verde:#2F6B63; --ocre:#8A6F3E; --ameixa:#6E5A82;
  --rail:238px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
  font-family:'Archivo',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
/* Layout sem flex de propósito. A barra é fixa e o main recua pela margem, então
   o posicionamento não depende de quem é o container (body, #root ou outro).
   Com flex no body, o único item flex era o #root e o conteúdo passava por baixo. */
#root{min-height:100vh}
a{color:inherit}
.mono{font-family:'Roboto Mono',monospace;font-variant-numeric:tabular-nums}
.disp{font-family:'Newsreader',Georgia,serif}

/* ---------- rail ---------- */
.rail{position:fixed;left:0;top:0;bottom:0;width:var(--rail);z-index:10;
  background:var(--panel);border-right:1px solid var(--rule);
  display:flex;flex-direction:column;padding:28px 0 18px;overflow-y:auto}
.brand{padding:0 22px 20px;border-bottom:2px solid var(--azul)}
.brand .mark{font-family:'Newsreader',Georgia,serif;font-weight:500;font-size:21px;letter-spacing:-.01em;line-height:1.1;color:var(--azul)}
.brand .sub{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin-top:9px;font-family:'Roboto Mono',monospace}
.nav{padding:14px 12px;display:flex;flex-direction:column;gap:1px;overflow-y:auto}
.nav button{all:unset;cursor:pointer;display:flex;gap:11px;align-items:baseline;padding:9px 11px;
  font-size:13.5px;color:var(--ink2);transition:background .15s,color .15s;border-left:2px solid transparent}
.nav button:hover{background:var(--panel2);color:var(--ink)}
.nav button:focus-visible{outline:2px solid var(--azul);outline-offset:1px}
.nav button.on{background:var(--panel2);color:var(--azul);border-left-color:var(--azul);font-weight:500}
.nav button.on .idx{color:var(--azul)}
.idx{font-family:'Roboto Mono',monospace;font-size:10px;color:var(--ink3);letter-spacing:.06em}
.railfoot{margin-top:auto;padding:16px 22px 0;border-top:1px solid var(--rule);font-size:10.5px;color:var(--ink3);line-height:1.8;font-family:'Roboto Mono',monospace}

/* ---------- main ---------- */
main{margin-left:var(--rail);min-width:0;padding:38px 44px 90px;max-width:1500px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;
  margin-bottom:36px;padding-bottom:18px;border-bottom:2px solid var(--azul)}
h1{font-family:'Newsreader',Georgia,serif;font-weight:500;font-size:34px;letter-spacing:-.012em;margin:0 0 10px;color:var(--azul)}
.lede{color:var(--ink2);font-size:14.5px;max-width:660px;line-height:1.65;margin:0}
.stamp{font-family:'Roboto Mono',monospace;font-size:10.5px;color:var(--ink3);text-align:right;line-height:1.9}
.stamp b{color:var(--azul);font-weight:500}

section{margin-bottom:58px;scroll-margin-top:20px}
.shead{display:flex;align-items:baseline;gap:14px;padding-bottom:10px;margin-bottom:20px;border-bottom:1px solid var(--rule2)}
.shead .n{font-family:'Roboto Mono',monospace;font-size:11px;color:var(--azul2)}
.shead h2{font-family:'Newsreader',Georgia,serif;font-weight:500;font-size:22px;letter-spacing:-.01em;margin:0;color:var(--azul)}
.shead .hint{margin-left:auto;font-size:12px;color:var(--ink3);text-align:right;max-width:430px;line-height:1.5}

.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g23{grid-template-columns:1.55fr 1fr}
@media(max-width:1180px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2,.g23{grid-template-columns:1fr}}
@media(max-width:820px){.rail{position:static;width:100%;height:auto;bottom:auto;overflow:visible}
  .nav{flex-direction:row;flex-wrap:wrap}main{margin-left:0;padding:24px 18px 60px}.g4{grid-template-columns:1fr 1fr}}

.card{background:var(--panel);border:1px solid var(--rule);padding:16px 18px}
.card.pad{padding:18px 20px 10px}
.ctitle{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3);font-family:'Roboto Mono',monospace;margin-bottom:14px}

/* KPI tile */
.kpi{background:var(--panel);border:1px solid var(--rule);border-left:2px solid var(--k,var(--azul2));padding:14px 17px 13px}
.kpi .lab{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-family:'Roboto Mono',monospace}
.kpi .val{font-family:'Newsreader',Georgia,serif;font-weight:500;font-size:33px;letter-spacing:-.015em;line-height:1.15;margin-top:8px;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:14px;color:var(--ink3);margin-left:3px;letter-spacing:0;font-family:'Archivo',sans-serif}
.kpi .foot{margin-top:7px;font-size:11px;color:var(--ink2);font-family:'Roboto Mono',monospace}
.up{color:var(--vermelho)} .down{color:var(--verde)} .flat{color:var(--ink3)}

/* ---- assinatura: régua de pressão ---- */
.regua{display:flex;flex-direction:column;gap:1px;margin-top:4px}
.rrow{display:grid;grid-template-columns:196px 1fr 62px;align-items:center;gap:14px;padding:5px 0}
.rrow .nm{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{position:relative;height:18px;background:var(--track)}
.track .bar{position:absolute;left:0;top:0;bottom:0;transition:width .5s cubic-bezier(.2,.7,.3,1)}
.track .over{position:absolute;top:-2px;bottom:-2px;
  background:repeating-linear-gradient(115deg,var(--vermelho) 0 4px,#6E1B1C 4px 8px)}
.track .g100{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--ink)}
.track .g85{position:absolute;top:-1px;bottom:-1px;width:1px;background:var(--ocre)}
.rrow .pv{font-family:'Roboto Mono',monospace;font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.rscale{display:grid;grid-template-columns:196px 1fr 62px;gap:14px;margin-top:10px}
.rscale .ticks{position:relative;height:14px;font-family:'Roboto Mono',monospace;font-size:9.5px;color:var(--ink3)}
.rscale .ticks span{position:absolute;transform:translateX(-50%)}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:11px;color:var(--ink3);font-family:'Roboto Mono',monospace;margin-top:14px}
.legend i{display:inline-block;width:9px;height:9px;margin-right:6px;vertical-align:middle}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-family:'Roboto Mono',monospace;font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink3);font-weight:400;padding:0 10px 9px 0;border-bottom:1px solid var(--rule2)}
td{padding:9px 10px 9px 0;border-bottom:1px solid var(--grid);color:var(--ink)}
td.n,th.n{text-align:right;font-family:'Roboto Mono',monospace;font-variant-numeric:tabular-nums}
tbody tr:hover td{background:var(--panel2)}
.chip{display:inline-block;padding:2px 7px;font-family:'Roboto Mono',monospace;font-size:11px}

.note{background:var(--panel);border:1px solid var(--rule);border-left:2px solid var(--ocre);
  padding:15px 18px;font-size:13.5px;line-height:1.65;color:var(--ink2)}
.note .rot{display:block;font-family:'Roboto Mono',monospace;font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;margin-bottom:7px;color:var(--ocre)}
.note.alert{border-left-color:var(--vermelho)} .note.alert .rot{color:var(--vermelho)}
.note.ok{border-left-color:var(--verde)} .note.ok .rot{color:var(--verde)}
.note.lim{border-left-color:var(--azul2)} .note.lim .rot{color:var(--azul2)}
.notes{display:flex;flex-direction:column;gap:10px}
.recharts-cartesian-axis-tick text{font-family:'Roboto Mono',monospace;font-size:10px;fill:#7A7F86}
.recharts-default-tooltip{background:#F8F7F4!important;border:1px solid #C3BFB5!important;
  font-family:'Roboto Mono',monospace!important;font-size:11.5px!important}
.recharts-tooltip-label{color:#1B1F24!important;margin-bottom:5px!important}
.seg{display:inline-flex;border:1px solid var(--rule2);overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:5px 11px;font-size:11.5px;font-family:'Roboto Mono',monospace;color:var(--ink2)}
.seg button:hover{background:var(--panel2)} .seg button.on{background:var(--azul);color:var(--panel)}
.seg button:focus-visible{outline:2px solid var(--azul);outline-offset:-2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  body{background:#fff}
  .rail{display:none}
  main{margin-left:0;padding:0;max-width:none}
  section{break-inside:avoid;margin-bottom:26px}
  .card,.kpi,.note{border-color:#B9B5AB}
}
</style>
</head>
<body>
<div id="root"><main style="padding:60px 44px">
  <h1>Carregando o painel…</h1>
  <p class="lede" id="dg-msg">Buscando a competência mais recente.</p>
  <noscript><p class="lede">Este painel precisa de JavaScript habilitado.</p></noscript>
</main></div>
<script>
const e = React.createElement;
const {ResponsiveContainer,LineChart,Line,AreaChart,Area,BarChart,Bar,ComposedChart,XAxis,YAxis,CartesianGrid,Tooltip,Legend,ReferenceLine,Cell,PieChart,Pie} = Recharts;
const C = {azul:'#14395F',ardosia:'#5A7590',nevoa:'#93A8B8',verde:'#2F6B63',ocre:'#8A6F3E',ameixa:'#6E5A82',vermelho:'#9E2A2B',oliva:'#7D8A6B',areia:'#A8825E',mut:'#9AA0A6',line:'#E0DDD5',panel:'#F8F7F4'};
// compatibilidade com os nomes usados nos componentes
C.blue=C.azul; C.clay=C.ardosia; C.teal=C.verde; C.sand=C.ocre; C.plum=C.ameixa; C.alert=C.vermelho;
const MESLBL = {'01':'jan','02':'fev','03':'mar','04':'abr','05':'mai','06':'jun','07':'jul','08':'ago','09':'set','10':'out','11':'nov','12':'dez'};
const lbl = ym => MESLBL[ym.slice(5,7)] + '/' + ym.slice(2,4);
const num = (v,d=0) => v==null||isNaN(v) ? '–' : v.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});

function serie(obj, meses){ return meses.map((m,i)=>{const o={m:lbl(m),ym:m};
  Object.keys(obj).forEach(k=>o[k]=obj[k][i]); return o;}); }

const grid = () => e(CartesianGrid,{stroke:C.line,strokeDasharray:'2 4',vertical:false});
const xa = () => e(XAxis,{dataKey:'m',tickLine:false,axisLine:{stroke:C.line},interval:'preserveStartEnd',minTickGap:14});
const ya = (p={}) => e(YAxis,Object.assign({tickLine:false,axisLine:false,width:44},p));
const tip = (p={}) => e(Tooltip,Object.assign({cursor:{stroke:C.line}},p));
</script>
<script>
function iniciar(DATA){
/* ============ helpers ============ */
const M = DATA.meses, LAST = M.length-1, K = DATA.kpi;
const ult = a => a[LAST], pen = a => a[LAST-1];
const delta = (a) => { const x=ult(a), y=pen(a); if(x==null||y==null) return null; return x-y; };
const ytd = (a,n=12) => a.slice(-n).reduce((s,v)=>s+(v||0),0);

function Kpi({lab,val,unit,dec=0,foot,cor,inv}){
  return e('div',{className:'kpi',style:{'--k':cor||C.mut}},
    e('div',{className:'lab'},lab),
    e('div',{className:'val'},num(val,dec), unit?e('small',null,unit):null),
    foot?e('div',{className:'foot'},foot):null);
}
function Trend({arr,dec=1,unit='',good='down'}){
  const d = delta(arr); if(d==null) return null;
  const cls = Math.abs(d)<1e-9?'flat':((d>0)===(good==='up')?'down':'up');
  return e('span',{className:cls}, (d>0?'▲ +':'▼ ')+num(d,dec)+unit+' sobre a competência anterior');
}

/* ============ SIGNATURE: régua de pressão ============ */
function Regua(){
  const MAX=180;
  const linhas = Object.keys(DATA.ocupacao)
    .map(k=>({nm:k, v:ult(DATA.ocupacao[k])}))
    .filter(o=>o.v!=null).sort((a,b)=>b.v-a.v);
  const px = v => Math.min(v,MAX)/MAX*100;
  return e('div',{className:'card pad'},
    e('div',{className:'ctitle'},'Taxa de ocupação por unidade · '+lbl(M[LAST])),
    e('div',{className:'regua'},
      linhas.map(o=>{
        const over = o.v>100;
        const cor = o.v>=100?C.vermelho : o.v>=85?C.azul : o.v>=60?C.ardosia : C.nevoa;
        return e('div',{className:'rrow',key:o.nm},
          e('div',{className:'nm',title:o.nm},o.nm),
          e('div',{className:'track'},
            e('div',{className:'bar',style:{width:px(Math.min(o.v,100))+'%',background:cor}}),
            over?e('div',{className:'over',style:{left:px(100)+'%',width:(px(o.v)-px(100))+'%'}}):null,
            e('div',{className:'g85',style:{left:px(85)+'%'}}),
            e('div',{className:'g100',style:{left:px(100)+'%'}})),
          e('div',{className:'pv',style:{color:over?C.alert:'inherit'}},num(o.v,1)+'%'));
      })),
    e('div',{className:'rscale'}, e('div'), e('div',{className:'ticks'},
        [0,25,50,75,100,125,150,175].map(t=>e('span',{key:t,style:{left:(t/MAX*100)+'%'}},t+'%'))), e('div')),
    e('div',{className:'legend'},
      e('span',null,e('i',{style:{background:C.nevoa}}),'até 60%'),
      e('span',null,e('i',{style:{background:C.ardosia}}),'60% a 85%'),
      e('span',null,e('i',{style:{background:C.azul}}),'85% a 100%'),
      e('span',null,e('i',{style:{background:'repeating-linear-gradient(115deg,#9E2A2B 0 3px,#6E1B1C 3px 6px)'}}),'acima de 100%: excedente'),
      e('span',null,e('i',{style:{background:C.ocre}}),'limiar de referência (85%)')));
}

/* ============ seções ============ */
function Panorama(){
  const d = serie({to:K.to,mp:K.mp,giro:K.giro,is:K.is_dias,pd:K.pac_dia,int:K.intern},M);
  const mix = ['SUS','Convênio','Particular'].map((k,i)=>({name:k,value:ult(DATA.pagador[k]),
     fill:[C.azul,C.ardosia,C.nevoa][i]}));
  const totMix = mix.reduce((s,o)=>s+o.value,0);
  return e('section',{id:'panorama'},
    e('div',{className:'shead'}, e('span',{className:'n'},'01'), e('h2',null,'Panorama'),
      e('span',{className:'hint'},'Indicadores globais da competência corrente, acompanhados da série histórica.')),
    e('div',{className:'grid g4',style:{marginBottom:14}},
      e(Kpi,{lab:'Taxa de ocupação',val:ult(K.to),unit:'%',dec:1,cor:C.azul,
        foot:e(Trend,{arr:K.to,unit:' p.p.',good:'down'})}),
      e(Kpi,{lab:'Permanência média',val:ult(K.mp),unit:' d',dec:2,cor:C.ocre,
        foot:e(Trend,{arr:K.mp,dec:2,unit:' d'})}),
      e(Kpi,{lab:'Intervalo de substituição',val:ult(K.is_dias),unit:' d',dec:2,cor:C.ardosia,
        foot:'tempo médio de leito desocupado'}),
      e(Kpi,{lab:'Giro de leito',val:ult(K.giro),unit:'/mês',dec:2,cor:C.verde,
        foot:e(Trend,{arr:K.giro,dec:2,good:'up'})})),
    e('div',{className:'grid g4',style:{marginBottom:16}},
      e(Kpi,{lab:'Internações',val:ult(K.intern),cor:C.azul,foot:num(ytd(K.intern),0)+' em doze meses'}),
      e(Kpi,{lab:'Paciente-dia',val:ult(K.pac_dia),cor:C.ameixa,foot:e(Trend,{arr:K.pac_dia,good:'up'})}),
      e(Kpi,{lab:'Cirurgias',val:ult(K.cirurgias),cor:C.verde,foot:num(ytd(K.cirurgias),0)+' em doze meses'}),
      e(Kpi,{lab:'Atendimentos no PS',val:ult(K.ps),cor:C.ocre,foot:num(ult(K.conv_ps),1)+'% resultaram em internação'})),
    e('div',{className:'grid g23'},
      e('div',{className:'card pad'},
        e('div',{className:'ctitle'},'Ocupação, permanência e intervalo de substituição'),
        e(ResponsiveContainer,{width:'100%',height:250},
          e(ComposedChart,{data:d,margin:{top:6,right:8,left:0,bottom:0}},grid(),xa(),
            ya({yAxisId:'l',domain:[60,95],unit:'%'}), ya({yAxisId:'r',orientation:'right',domain:[0,6],width:34}),
            tip(),
            e(Area,{yAxisId:'l',type:'monotone',dataKey:'to',name:'Ocupação (%)',stroke:C.azul,fill:C.azul,fillOpacity:.10,strokeWidth:2}),
            e(Line,{yAxisId:'r',type:'monotone',dataKey:'mp',name:'Permanência (d)',stroke:C.ocre,strokeWidth:1.8,dot:false}),
            e(Line,{yAxisId:'r',type:'monotone',dataKey:'is',name:'Interv. substituição (d)',stroke:C.ardosia,strokeWidth:1.8,dot:false,strokeDasharray:'4 3'}),
            e(ReferenceLine,{yAxisId:'l',y:85,stroke:C.ocre,strokeDasharray:'3 3'}),
            e(Legend,{wrapperStyle:{fontSize:11,fontFamily:'Roboto Mono'}})))),
      e('div',{className:'card pad'},
        e('div',{className:'ctitle'},'Internações por fonte pagadora'),
        e(ResponsiveContainer,{width:'100%',height:250},
          e(PieChart,null,
            e(Pie,{data:mix,dataKey:'value',nameKey:'name',innerRadius:58,outerRadius:88,paddingAngle:2,stroke:'#F8F7F4'},
              mix.map(m=>e(Cell,{key:m.name,fill:m.fill}))),
            tip({}), e(Legend,{wrapperStyle:{fontSize:11,fontFamily:'Roboto Mono'}}))),
        e('div',{style:{textAlign:'center',marginTop:-6,fontSize:12,color:'#7A7F86',fontFamily:'Roboto Mono'}},
          num(mix[0].value/totMix*100,1)+'% SUS'))),
    e('div',{className:'notes',style:{marginTop:16}},
      e('div',{className:'note alert'},e('span',{className:'rot'},'Ponto de atenção'),
        'A taxa de ocupação passou de ',num(K.to[0],1),'% em janeiro de 2025 para ',num(ult(K.to),1),
        '% em junho de 2026, com redução do intervalo de substituição de ',num(K.is_dias[0],2),' para ',
        num(ult(K.is_dias),2),' dia. Nesse patamar, a capacidade disponível para absorver variação sazonal, surto ou bloqueio de leito por isolamento é reduzida.')));
}

function Pressao(){
  const b = M.map((m,i)=>({m:lbl(m),cap:DATA.boarding.cap[i],pd:DATA.boarding.pd[i],
     exc:(DATA.boarding.pd[i]||0)-(DATA.boarding.cap[i]||0)}));
  const dias = 30;
  return e('section',{id:'pressao'},
    e('div',{className:'shead'}, e('span',{className:'n'},'02'), e('h2',null,'Ocupação por unidade'),
      e('span',{className:'hint'},'Razão entre paciente-dia e capacidade operacional. Valores acima de 100% indicam paciente-dia registrado além do número de leitos censitários da unidade.')),
    e(Regua),
    e('div',{className:'grid g23',style:{marginTop:14}},
      e('div',{className:'card pad'},
        e('div',{className:'ctitle'},'Internação P.S.: paciente-dia e capacidade operacional'),
        e(ResponsiveContainer,{width:'100%',height:230},
          e(ComposedChart,{data:b,margin:{top:6,right:8,left:0,bottom:0}},grid(),xa(),ya({}),tip(),

    },{rootMargin:'-15% 0px -70% 0px'});
    SECOES.forEach(s=>{const el=document.getElementById(s[2]); if(el) obs.observe(el);});
    return ()=>obs.disconnect();

  const ir = id => document.getElementById(id)?.scrollIntoView({behavior:'smooth',block:'start'});
  return e(React.Fragment,null,
    e('nav',{className:'rail'},

      e('div',{className:'top'},
        e('div',null,
          e('h1',null,'Painel do Comitê de Gestão Estratégica e Governança'),
          e('p',{className:'lede'},'Indicadores assistenciais e operacionais do Hospital Universitário São Francisco, apurados a partir do censo hospitalar e do relatório de atendimentos. A série cobre 18 competências, de janeiro de 2025 a junho de 2026.')),
        e('div',{className:'stamp'},
          'Censo hospitalar 2025–2026',e('br'),
          'Reinternações jul/2025 a jun/2026',e('br'),
          e('b',null,num(M.length),' competências · ',num(K.intern.reduce((s,v)=>s+v,0)),' internações'))),
      e(Panorama),e(Pressao),e(Fluxo),e(Desfechos),e(Reint),e(Producao),e(Dados)));
}
ReactDOM.createRoot(document.getElementById('root')).render(e(App));

// O ResponsiveContainer do Recharts mede a largura do elemento pai no momento
// da montagem. Se medir zero — layout ainda assentando, fontes da Google ainda
// carregando —, o gráfico nasce vazio e só se recupera no primeiro resize da
// janela. Era isso que fazia o Panorama abrir em branco e aparecer depois de um
// clique qualquer. Forçamos a remedição em vez de depender de interação.
const remedir = function () {
  try { window.dispatchEvent(new Event('resize')); } catch (_) {}
};
if (typeof requestAnimationFrame === 'function') requestAnimationFrame(remedir);
setTimeout(remedir, 150);
setTimeout(remedir, 700);
if (document.fonts && document.fonts.ready && document.fonts.ready.then) {
  document.fonts.ready.then(remedir).catch(function () {});
}
}

// Servido pelo app no Render: os dados vêm da API autenticada.
// Para desenvolvimento local, use ?local=1 e o JSON ao lado do arquivo.
var faltando = [];
if (typeof React === 'undefined')    faltando.push('React');
if (typeof ReactDOM === 'undefined') faltando.push('ReactDOM');
if (typeof PropTypes === 'undefined') faltando.push('PropTypes');
if (typeof Recharts === 'undefined') faltando.push('Recharts');
if (faltando.length) {
  window.__dgFalhou(
    'Bibliotecas não carregadas',
    'O painel depende de ' + faltando.join(', ') + ', servidos por unpkg.com. ' +
    'A rede desta máquina parece estar bloqueando esse endereço.',
    (window.__dg.erros.join(' · ') || 'sem detalhe do navegador'));
  throw new Error('dependencias ausentes');
}

const LOCAL = new URLSearchParams(location.search).has('local');
const COMP  = new URLSearchParams(location.search).get('competencia');
const FONTE_DADOS = LOCAL ? 'data_governanca.json'
                          : '/gov/api/dados' + (COMP ? '/' + COMP : '');

fetch(FONTE_DADOS, {cache:'no-store', credentials:'same-origin'})
  .then(r => {
    if (r.status === 401) throw new Error('sessao');
    if (r.status === 403) throw new Error('permissao');
    if (r.status === 404) throw new Error('vazio');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(iniciar)
  .catch(err => {
    const M = {
      sessao:    ['Sessão expirada', 'Entre novamente para abrir o painel.',
                  '<a href="/?next=/gov">Ir para o login</a>'],
      permissao: ['Sem permissão', 'Sua conta está autenticada, mas não tem o papel de governança. Fale com a coordenação.',
                  'Solicite liberação ao coordenador do comitê.'],
      vazio:     ['Nenhuma competência publicada', 'O painel está no ar, mas ainda não recebeu dados.',
                  'Rode <code>python3 gerar_governanca.py</code> e depois <code>python3 publicar.py</code>.']
    }[err.message];
    if (M) {
      document.getElementById('root').innerHTML =
        '<main style="padding:60px 44px"><h1>' + M[0] + '</h1>' +
        '<p class="lede">' + M[1] + '</p><p class="lede">' + M[2] + '</p></main>';
      return;
    }
    legado(err);
  });

// Se em 12 s nada substituiu o placeholder, algo travou sem lançar erro.
setTimeout(function () {
  var r = document.getElementById('root');
  if (r && /Carregando o painel/.test(r.innerHTML)) {
    window.__dgFalhou('O painel não terminou de carregar',
      'A página abriu, mas os dados ou as bibliotecas não chegaram em 12 segundos.',
      (window.__dg.erros.join(' · ') || 'nenhum erro reportado pelo navegador'));
  }
}, 12000);

function legado(err) {
  if (LOCAL) {
    window.__dgFalhou('Dados não carregados',
      'O arquivo <code>' + FONTE_DADOS + '</code> não foi encontrado ao lado desta página. ' +
      'Gere-o com <code>python3 gerar_governanca.py</code> e abra por um servidor local ' +
      '(<code>python3 -m http.server</code>), não por duplo clique no arquivo.',
      err.message);
  } else {
    window.__dgFalhou('Dados não carregados',
      'O painel não conseguiu ler <code>' + FONTE_DADOS + '</code>. ' +
      'Se a competência já foi publicada, isto costuma ser sessão expirada ou instabilidade de rede — ' +
      'recarregue a página.',
      err.message + (window.__dg.erros.length ? ' · ' + window.__dg.erros.join(' · ') : ''));
  }
}

</script>
</body>
</html>
